<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mine Rails</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Falcon Mining Guild</p>
          <h1>Mine Rails</h1>
          <p>Trenle ray üstü damar taraması yap, arabayla vadilere in, yürüyerek gizli cevherleri bul.</p>
        </div>
        <button id="newGame">Yeni Oyun</button>
      </section>

      <section class="panel stats" aria-label="Oyun istatistikleri">
        <span>Gün <strong id="day">1</strong></span>
        <span>Enerji <strong id="energy">100</strong></span>
        <span>Yakıt <strong id="fuel">55</strong></span>
        <span>Kredi <strong id="credits">0</strong></span>
        <span>İtibar <strong id="rep">0</strong></span>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2>Keşif modu</h2>
          <div class="modes" id="modes"></div>
          <div class="actions">
            <button id="scan">Bölgeyi tara</button>
            <button id="mine" class="primary">Madeni çıkar</button>
            <button id="sell">Cevheri sat</button>
            <button id="rest">Kampta dinlen</button>
          </div>
          <h2>Depo</h2>
          <div id="inventory" class="inventory"></div>
        </aside>

        <section class="board-card">
          <div class="board-head">
            <div>
              <p class="eyebrow">Harita</p>
              <h2>Kayalık Bozkır Sektörü</h2>
            </div>
            <p id="status">Bir mod seç ve keşfe başla.</p>
          </div>
          <div id="map" class="map" role="grid" aria-label="Maden haritası"></div>
        </section>
      </section>

      <section class="panel log-panel">
        <h2>Saha günlüğü</h2>
        <ol id="log"></ol>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
