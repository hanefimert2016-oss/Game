name: Arc Squad / Vendor real CC0 meshes
on:
  push:
    branches: [arc-squad-stylized-multiplayer-20261019]
    paths: [.github/workflows/arc-squad-assets.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arc-squad-stylized-multiplayer-20261019
      - name: Copy previously downloaded genuine Kenney CC0 models
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=UnityArcFlight/Assets/ArcFlight/Vendor/Kenney/Models
          TARGET=ArcSquadUnity/Assets/ArcSquad/Art/Kenney/Models
          test -d "$SOURCE"
          mkdir -p "$TARGET"
          find "$SOURCE" -maxdepth 1 -name '*.obj' -exec cp '{}' "$TARGET" ';'
          test "$(find "$TARGET" -name '*.obj' | wc -l)" -ge 20
          echo "Real OBJ mesh count: $(find "$TARGET" -name '*.obj' | wc -l)"
      - name: Commit assets to co-op game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ArcSquadUnity/Assets/ArcSquad/Art/Kenney/Models/
          if ! git diff --cached --quiet; then
            git commit -m 'assets: add 24 Kenney CC0 real OBJ models to stylized multiplayer game'
            git push origin HEAD:arc-squad-stylized-multiplayer-20261019
          fi
