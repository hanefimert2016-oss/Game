name: Unity Editor diagnostic extraction
on:
  push:
    branches: [unity-native-arc-flight-20261019]
    paths: [.github/workflows/unity-arc-evidence-publish.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unity-native-arc-flight-20261019
      - name: Download exact prior Unity Editor evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/hanefimert2016-oss/Game/actions/artifacts/12214006748/zip" \
            -o /tmp/unity-evidence.zip
          mkdir -p /tmp/unity-evidence-report
          unzip -q /tmp/unity-evidence.zip -d /tmp/unity-evidence-report
          find /tmp/unity-evidence-report -maxdepth 3 -type f -printf '%P\n'
          mkdir -p UnityArcFlight/verification
          python3 - <<'PY'
          from pathlib import Path
          base=Path('/tmp/unity-evidence-report')
          lines=['# Unity Editor GUI attempt 39303892538','', 'GitHub job workflow success does not imply Editor installed.', '']
          for name in ['install-status.txt','install-log-tail.txt','editor-list.txt','gui-status.txt','README-STATUS.txt']:
              matches=list(base.rglob(name))
              if matches:
                  txt=matches[0].read_text(errors='replace')[-12000:]
                  lines.extend(['## '+name,'', '~~~text',txt,'~~~',''])
          Path('UnityArcFlight/verification/editor-real-attempt.md').write_text('\n'.join(lines))
          PY
      - name: Publish diagnostic for inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UnityArcFlight/verification/editor-real-attempt.md
          git commit -m 'ci: publish true Editor GUI attempt diagnostics'
          git push origin HEAD:unity-native-arc-flight-20261019
